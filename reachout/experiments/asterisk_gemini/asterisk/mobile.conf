; /etc/asterisk/mobile.conf  (chan_mobile: a Bluetooth phone acts as the PSTN gateway)
; Find addresses with: hcitool dev   (adapter)   and   hcitool scan   (phone)
[general]
interval=30

[adapter]
address=AA:BB:CC:DD:EE:FF       ; the PC's Bluetooth adapter
id=blue

[phone]
address=11:22:33:44:55:66       ; your phone
port=3                          ; HFP channel; find with: sdptool search --bdaddr <phone> HFP
context=gemini-test
adapter=blue
group=1
