; Append to /etc/asterisk/extensions.conf
[gemini-test]
; Outbound: the phone (paired as "phone" in mobile.conf) dials the number, and when it
; answers, Asterisk bridges the call audio to the Python bridge over AudioSocket.
;   asterisk -rx "channel originate Mobile/phone/+91XXXXXXXXXX extension s@gemini-test"
exten => s,1,NoOp(Gemini test call)
 same => n,Answer()
 same => n,AudioSocket(${UNIQUEID},127.0.0.1:9092)
 same => n,Hangup()

; Inbound: calls to the paired phone also land on s@gemini-test (context=gemini-test in mobile.conf).
